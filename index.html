<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JSON Formatter</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">JSON Formatter</h2>

        <div class="row align-items-stretch">

            <!-- Input -->
            <div class="col-md-5">
                <label class="form-label">Введите JSON</label>
                <textarea id="jsonInput" class="form-control" rows="15"></textarea>
            </div>

            <!-- BUTTON -->
            <div class="col-md-2 d-flex justify-content-center">
                <button id="formatBtn" class="btn btn-primary format-btn">▶</button>
            </div>

            <!-- Output -->
            <div class="col-md-5">
                <label class="form-label">Результат</label>
                <pre id="result" class="result-box"></pre>
            </div>

        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
